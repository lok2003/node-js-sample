name: Node.js CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
           

      - name: Install Dependencies
        run: npm install

      - name: Create app Artifact
        run: |
         zip -r nodejs-app.zip . \
         -x "node_modules/* " \
         -x ".git/*"
      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-js-sample
          path: nodejs-app.zip